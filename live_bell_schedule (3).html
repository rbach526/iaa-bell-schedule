<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bell Schedule</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-glow { transition: all 0.3s ease; }
        .active-ring { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .active-transition { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-600 text-white rounded-xl shadow-md shadow-blue-500/20">
                    <i data-lucide="bell" class="w-6 h-6 animate-pulse"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Live Bell Schedule</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="current-date-display">Loading date...</p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-2">
                <!-- Sound Toggle -->
                <button id="btn-sound" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300" title="Toggle Chime Sound">
                    <i data-lucide="volume-2" id="icon-sound" class="w-5 h-5"></i>
                </button>
                <!-- Notification Toggle -->
                <button id="btn-notifications" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300" title="Toggle Notifications">
                    <i data-lucide="bell-ring" id="icon-notifications" class="w-5 h-5"></i>
                </button>
                <!-- Dark Mode Toggle -->
                <button id="btn-theme" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300" title="Toggle Theme">
                    <i data-lucide="moon" id="icon-theme" class="w-5 h-5"></i>
                </button>
                <!-- Schedule Settings Button -->
                <button id="btn-edit-schedule" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-medium text-sm transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Manage Schedules</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- Active Period Banner / Dashboard Hero -->
        <section class="bg-white dark:bg-slate-800/80 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/60 relative overflow-hidden transition-all">
            <!-- Background Accent Bar -->
            <div id="hero-accent-bar" class="absolute top-0 left-0 right-0 h-1.5 bg-blue-500"></div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                <!-- Clock & Status Info -->
                <div class="md:col-span-7 flex flex-col gap-3">
                    <div class="flex items-center gap-2">
                        <span id="period-badge" class="px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">
                            Class Period
                        </span>
                        <span id="current-clock" class="text-xs font-mono text-slate-500 dark:text-slate-400">12:00:00 PM</span>
                    </div>

                    <div>
                        <h2 id="active-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                            Loading Schedule...
                        </h2>
                        <p id="active-subtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                            Calculating current period dynamics...
                        </p>
                    </div>

                    <!-- Progress Bar Component -->
                    <div class="mt-2 space-y-1.5">
                        <div class="flex justify-between text-xs font-medium text-slate-500 dark:text-slate-400">
                            <span id="time-start-label">--:--</span>
                            <span id="progress-percent-label">0% completed</span>
                            <span id="time-end-label">--:--</span>
                        </div>
                        <div class="w-full h-3 bg-slate-100 dark:bg-slate-700/60 rounded-full overflow-hidden p-0.5">
                            <div id="progress-bar-fill" class="h-full bg-blue-500 rounded-full transition-all duration-500 ease-out w-0"></div>
                        </div>
                    </div>
                </div>

                <!-- Big Countdown Box -->
                <div class="md:col-span-5 flex flex-col items-center justify-center p-5 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200/60 dark:border-slate-800 text-center">
                    <span class="text-xs uppercase tracking-wider font-semibold text-slate-400 dark:text-slate-500 mb-1">Time Remaining</span>
                    <div id="countdown-timer" class="text-4xl sm:text-5xl font-mono font-bold tracking-tight text-slate-800 dark:text-slate-100">
                        00:00:00
                    </div>
                    <span id="countdown-label" class="text-xs text-slate-500 dark:text-slate-400 mt-2">until period ends</span>
                </div>
            </div>
        </section>

        <!-- Schedule Selector & Filter Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2 w-full sm:w-auto">
                <i data-lucide="calendar" class="w-5 h-5 text-slate-400"></i>
                <label for="schedule-select" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Preset:</label>
                <select id="schedule-select" class="flex-1 sm:w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Transition Toggle -->
            <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400 self-end sm:self-auto">
                <input type="checkbox" id="show-transitions-toggle" checked class="rounded border-slate-300 dark:border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                <label for="show-transitions-toggle" class="cursor-pointer select-none">Show passing periods in list</label>
            </div>
        </div>

        <!-- Schedule Period List -->
        <section class="bg-white dark:bg-slate-800/80 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200/80 dark:border-slate-700/60 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/40">
                <h3 class="font-semibold text-sm tracking-wide uppercase text-slate-500 dark:text-slate-400">Today's Schedule</h3>
                <span id="schedule-period-count" class="text-xs bg-slate-200 dark:bg-slate-700 px-2.5 py-1 rounded-full font-medium text-slate-600 dark:text-slate-300">0 Items</span>
            </div>

            <div id="schedule-list" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                <!-- Dynamically rendered schedule rows -->
            </div>
        </section>

    </main>

    <!-- Modal: Schedule Manager & Customizer -->
    <div id="modal-settings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-blue-500"></i>
                    <h3 class="font-bold text-lg">Manage Bell Schedules</h3>
                </div>
                <button id="btn-close-modal" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- Schedule Selection / Creation Controls -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200/60 dark:border-slate-700/50">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Editing Preset</label>
                        <select id="modal-preset-select" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-sm font-medium">
                            <!-- Options -->
                        </select>
                    </div>
                    <div class="flex space-x-2 self-end sm:self-auto">
                        <button id="btn-add-preset" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium flex items-center gap-1 transition">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> New Preset
                        </button>
                        <button id="btn-delete-preset" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-lg text-xs font-medium flex items-center gap-1 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete

                    </div>

                <!-- Periods Editor List -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Periods Editor</h4>
                        <button id="btn-add-period" class="text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium flex items-center gap-1">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Add Period
                        </button>
                    </div>

                    <div id="editor-period-list" class="space-y-3">
                        <!-- Dynamic Period Editor Rows -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/40">
                <button id="btn-reset-defaults" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 underline">
                    Reset to Default Schedules
                </button>
                <div class="flex space-x-2">
                    <button id="btn-cancel-modal" class="px-4 py-2 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        Cancel
                    </button>
                    <button id="btn-save-modal" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white shadow-md shadow-blue-500/20 transition">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

                    { name: "5th Period", start: "09:24", end: "09:53", type: "class" },
                    { name: "6th Period", start: "09:56", end: "10:25", type: "class" },
                    { name: "7th Period", start: "10:28", end: "10:57", type: "class" },
                    { name: "8th Period", start: "11:00", end: "11:29", type: "class" }
                ]
            },
            "hs_early_dismissal": {
                name: "High School Early Dismissal",
                periods: [
                    { name: "2nd Period", start: "07:05", end: "07:44", type: "class" },
                    { name: "3rd Period", start: "07:47", end: "08:16", type: "class" },
                    { name: "4th Period", start: "08:19", end: "08:48", type: "class" },
                    { name: "5th Period", start: "08:51", end: "09:20", type: "class" },
                    { name: "C Lunch", start: "09:23", end: "09:53", type: "lunch" },
                    { name: "6th Period (D Class)", start: "09:23", end: "09:52", type: "class" },

                    { name: "6th Period (C Class)", start: "09:56", end: "10:25", type: "class" },
                    { name: "7th Period", start: "10:28", end: "10:57", type: "class" },
                    { name: "8th Period", start: "11:00", end: "11:29", type: "class" }
                ]
            },
            "ms_delay_2hr": {

                periods: [

                    { name: "A Lunch", start: "10:32", end: "11:02", type: "lunch" },
                    { name: "4th Period (B Class)", start: "10:32", end: "11:08", type: "class" },
                    { name: "4th Period (A Class)", start: "11:05", end: "11:41", type: "class" },
                    { name: "B Lunch", start: "11:11", end: "11:41", type: "lunch" },
                    { name: "5th Period", start: "11:44", end: "12:20", type: "class" },
                    { name: "6th Period", start: "12:23", end: "12:59", type: "class" },
                    { name: "7th Period", start: "13:02", end: "13:38", type: "class" },
                    { name: "8th Period", start: "13:41", end: "14:17", type: "class" }
                ]
            },
            "hs_delay_2hr": {
                name: "High School 2-Hr Delay",
                periods: [
                    { name: "2nd Period", start: "09:05", end: "09:50", type: "class" },
                    { name: "3rd Period", start: "09:53", end: "10:29", type: "class" },
                    { name: "4th Period", start: "10:32", end: "11:08", type: "class" },
                    { name: "5th Period", start: "11:11", end: "11:47", type: "class" },
                    { name: "C Lunch", start: "11:50", end: "12:20", type: "lunch" },
                    { name: "6th Period (C Class)", start: "12:23", end: "12:59", type: "class" },
                    { name: "6th Period (D Class)", start: "11:50", end: "12:26", type: "class" },
                    { name: "D Lunch", start: "12:29", end: "12:59", type: "lunch" },
                    { name: "7th Period", start: "13:02", end: "13:38", type: "class" },
                    { name: "8th Period", start: "13:41", end: "14:17", type: "class" }
                ]
            }
        };

        // Application State
        let schedules = {};
        let activeScheduleKey = "ms_regular";
        let showTransitions = true;
        let soundEnabled = false;
        let notificationsEnabled = false;
        let lastNotifiedPeriodKey = null;
        let editingScheduleKey = "ms_regular";
        let tempEditingSchedule = null;

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            initTheme();
            initEventListeners();
            lucide.createIcons();
            
            // Start Clock Loop
            updateClockAndSchedule();
            setInterval(updateClockAndSchedule, 1000);
        });

        function loadState() {
            const savedSchedules = localStorage.getItem('bell_schedules');
            if (savedSchedules) {
                try {
                    schedules = JSON.parse(savedSchedules);
                } catch (e) {
                    schedules = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES));
                }
            } else {
                schedules = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES));
            }

            const savedKey = localStorage.getItem('bell_active_key');
            if (savedKey && schedules[savedKey]) {
                activeScheduleKey = savedKey;
            }

            soundEnabled = localStorage.getItem('bell_sound') === 'true';
            notificationsEnabled = localStorage.getItem('bell_notifications') === 'true';

            updateSoundIcon();
            updateNotificationIcon();
            populateScheduleDropdown();
        }

        function saveSchedules() {
            localStorage.setItem('bell_schedules', JSON.stringify(schedules));
            localStorage.setItem('bell_active_key', activeScheduleKey);
        }

        // Helper: Convert "HH:MM" to seconds from midnight
        function timeToSeconds(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 3600 + m * 60;
        }

        // Helper: Convert Date to seconds from midnight
        function dateToSeconds(date) {
            return date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds();
        }

        // Helper: Format Seconds to HH:MM:SS or MM:SS
        function formatCountdown(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            const pad = num => String(num).padStart(2, '0');
            if (hrs > 0) {
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
            return `${pad(mins)}:${pad(secs)}`;
        }

        // Helper: Convert 24hr string to 12hr Display
        function format12Hour(timeStr) {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':').map(Number);
            const period = h >= 12 ? 'PM' : 'AM';
            const displayH = h % 12 || 12;
            return `${displayH}:${String(m).padStart(2, '0')} ${period}`;
        }

        // Compute full expanded list including passing times
        function getFullScheduleWithTransitions(scheduleKey) {
            const sched = schedules[scheduleKey];
            if (!sched || !sched.periods || sched.periods.length === 0) return [];

            const sorted = [...sched.periods].sort((a, b) => timeToSeconds(a.start) - timeToSeconds(b.start));
            const fullList = [];
            let maxPrevEnd = 0;

            for (let i = 0; i < sorted.length; i++) {
                const current = sorted[i];
                const currStart = timeToSeconds(current.start);
                const currEnd = timeToSeconds(current.end);

                // Check for transition before this class if gap exists with previous max end time
                if (i > 0 && currStart > maxPrevEnd) {
                    const prevEndItem = sorted.find(p => timeToSeconds(p.end) === maxPrevEnd);
                    const prevEndTimeStr = prevEndItem ? prevEndItem.end : sorted[i - 1].end;
                    
                    fullList.push({
                        name: `Passing Period`,
                        start: prevEndTimeStr,
                        end: current.start,
                        type: 'transition'
                    });
                }

                fullList.push(current);
                if (currEnd > maxPrevEnd) {
                    maxPrevEnd = currEnd;
                }
            }

            return fullList;
        }

        function updateClockAndSchedule() {
            const now = new Date();
            
            // Render Date/Clock Headings
            document.getElementById('current-date-display').innerText = now.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('current-clock').innerText = now.toLocaleTimeString();

            const currentSeconds = dateToSeconds(now);
            const fullSchedule = getFullScheduleWithTransitions(activeScheduleKey);

            let activeItem = null;
            let nextItem = null;

            for (let i = 0; i < fullSchedule.length; i++) {
                const startSec = timeToSeconds(fullSchedule[i].start);
                const endSec = timeToSeconds(fullSchedule[i].end);

                if (currentSeconds >= startSec && currentSeconds < endSec) {
                    activeItem = fullSchedule[i];
                    nextItem = fullSchedule[i + 1] || null;
                    break;
                } else if (currentSeconds < startSec) {
                    if (!nextItem) nextItem = fullSchedule[i];
                }
            }

            // Update UI with Active or Upcoming status
            renderHeroSection(activeItem, nextItem, currentSeconds, fullSchedule);
            renderScheduleList(fullSchedule, activeItem);
        }

        function renderHeroSection(activeItem, nextItem, currentSeconds, fullSchedule) {
            const badge = document.getElementById('period-badge');
            const title = document.getElementById('active-title');
            const subtitle = document.getElementById('active-subtitle');
            const timer = document.getElementById('countdown-timer');
            const timerLabel = document.getElementById('countdown-label');
            const progressBar = document.getElementById('progress-bar-fill');
            const progressPercentLabel = document.getElementById('progress-percent-label');
            const timeStartLabel = document.getElementById('time-start-label');
            const timeEndLabel = document.getElementById('time-end-label');
            const accentBar = document.getElementById('hero-accent-bar');

            if (activeItem) {
                const startSec = timeToSeconds(activeItem.start);
                const endSec = timeToSeconds(activeItem.end);
                const totalDuration = endSec - startSec;
                const elapsed = currentSeconds - startSec;
                const remaining = endSec - currentSeconds;
                const percent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

                title.innerText = activeItem.name;
                timeStartLabel.innerText = format12Hour(activeItem.start);
                timeEndLabel.innerText = format12Hour(activeItem.end);
                progressPercentLabel.innerText = `${Math.floor(percent)}% completed`;
                progressBar.style.width = `${percent}%`;
                timer.innerText = formatCountdown(remaining);
                timerLabel.innerText = `until ${activeItem.name} ends`;

                // Badge and accent styling based on period type
                if (activeItem.type === 'transition') {
                    badge.innerText = "Passing Period";
                    badge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300";
                    accentBar.className = "absolute top-0 left-0 right-0 h-1.5 bg-amber-500";
                    progressBar.className = "h-full bg-amber-500 rounded-full transition-all duration-500 ease-out";
                    subtitle.innerText = nextItem ? `Next up: ${nextItem.name}` : "Class starting soon";
                } else if (activeItem.type === 'lunch') {
                    badge.innerText = "Lunch Break";
                    badge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300";
                    accentBar.className = "absolute top-0 left-0 right-0 h-1.5 bg-emerald-500";
                    progressBar.className = "h-full bg-emerald-500 rounded-full transition-all duration-500 ease-out";
                    subtitle.innerText = "Enjoy your break!";
                } else if (activeItem.type === 'assembly') {
                    badge.innerText = "Special Event / Assembly";
                    badge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300";
                    accentBar.className = "absolute top-0 left-0 right-0 h-1.5 bg-purple-500";
                    progressBar.className = "h-full bg-purple-500 rounded-full transition-all duration-500 ease-out";
                    subtitle.innerText = "Assembly period active";
                } else {
                    badge.innerText = "Active Class Period";
                    badge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300";
                    accentBar.className = "absolute top-0 left-0 right-0 h-1.5 bg-blue-500";
                    progressBar.className = "h-full bg-blue-500 rounded-full transition-all duration-500 ease-out";
                    subtitle.innerText = nextItem ? `Up next: ${nextItem.name}` : "Final period of the schedule";
                }

                // Period boundary triggers (Notifications / Chimes)
                const currentPeriodKey = `${activeScheduleKey}_${activeItem.name}_${activeItem.start}`;
                if (lastNotifiedPeriodKey !== currentPeriodKey) {
                    triggerPeriodChangeEffects(activeItem);
                    lastNotifiedPeriodKey = currentPeriodKey;
                }

            } else {
                // Out of schedule hours
                const firstPeriod = fullSchedule[0];
                const lastPeriod = fullSchedule[fullSchedule.length - 1];

                badge.innerText = "Off Schedule";
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300";
                accentBar.className = "absolute top-0 left-0 right-0 h-1.5 bg-slate-400";
                progressBar.style.width = "0%";
                progressPercentLabel.innerText = "Inactive";
                timeStartLabel.innerText = "--:--";
                timeEndLabel.innerText = "--:--";

                if (firstPeriod && currentSeconds < timeToSeconds(firstPeriod.start)) {
                    const remaining = timeToSeconds(firstPeriod.start) - currentSeconds;
                    title.innerText = "School Day Has Not Started";
                    subtitle.innerText = `First period (${firstPeriod.name}) begins at ${format12Hour(firstPeriod.start)}`;
                    timer.innerText = formatCountdown(remaining);
                    timerLabel.innerText = "until school starts";
                } else {
                    title.innerText = "School Day Completed";
                    subtitle.innerText = "All scheduled periods have ended for today.";
                    timer.innerText = "00:00";
                    timerLabel.innerText = "Day finished";
                }
            }
        }

        function renderScheduleList(fullSchedule, activeItem) {
            const listContainer = document.getElementById('schedule-list');
            const countLabel = document.getElementById('schedule-period-count');

            const filteredSchedule = showTransitions 
                ? fullSchedule 
                : fullSchedule.filter(item => item.type !== 'transition');

            countLabel.innerText = `${filteredSchedule.length} Items`;

            if (filteredSchedule.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400">No schedule items defined for this preset.</div>`;
                return;
            }

            let html = '';
            filteredSchedule.forEach((item) => {
                const isActive = activeItem && activeItem.name === item.name && activeItem.start === item.start;
                const isTransition = item.type === 'transition';
                const isLunch = item.type === 'lunch';
                const isAssembly = item.type === 'assembly';

                // Row Container Classes
                let rowBg = "hover:bg-slate-50/80 dark:hover:bg-slate-700/30";
                let iconColor = "text-slate-400";
                let iconName = "clock";
                let badgeStyle = "hidden";

                if (isActive) {
                    if (isTransition) {
                        rowBg = "bg-amber-50/90 dark:bg-amber-950/30 border-l-4 border-amber-500 font-medium active-transition";
                        iconColor = "text-amber-500";
                        iconName = "footprints";
                    } else if (isLunch) {
                        rowBg = "bg-emerald-50/90 dark:bg-emerald-950/30 border-l-4 border-emerald-500 font-medium active-ring";
                        iconColor = "text-emerald-500";
                        iconName = "utensils";
                    } else if (isAssembly) {
                        rowBg = "bg-purple-50/90 dark:bg-purple-950/30 border-l-4 border-purple-500 font-medium active-ring";
                        iconColor = "text-purple-500";
                        iconName = "sparkles";
                    } else {
                        rowBg = "bg-blue-50/90 dark:bg-blue-950/30 border-l-4 border-blue-500 font-medium active-ring";
                        iconColor = "text-blue-500";
                        iconName = "book-open";
                    }
                } else if (isTransition) {
                    rowBg = "bg-slate-50/40 dark:bg-slate-900/20 text-slate-500 dark:text-slate-400 text-xs";
                    iconName = "arrow-right";
                } else if (isLunch) {
                    iconName = "utensils";
                } else if (isAssembly) {
                    iconName = "sparkles";
                }

                html += `
                    <div class="px-6 py-4 flex items-center justify-between transition-all duration-200 ${rowBg}">
                        <div class="flex items-center space-x-3.5">
                            <div class="${iconColor}">
                                <i data-lucide="${iconName}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-semibold text-slate-800 dark:text-slate-100 ${isTransition ? 'text-xs font-normal italic' : 'text-base'}">
                                        ${item.name}
                                    </span>
                                    ${isActive ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-blue-600 text-white animate-pulse">NOW</span>` : ''}
                                </div>
                                <div class="text-xs text-slate-400 dark:text-slate-500 sm:hidden">
                                    ${format12Hour(item.start)} - ${format12Hour(item.end)}
                                </div>
                            </div>
                        </div>
                        <div class="hidden sm:block text-right font-mono text-sm text-slate-600 dark:text-slate-300">
                            ${format12Hour(item.start)} &mdash; ${format12Hour(item.end)}
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
            lucide.createIcons();
        }

        function playChime() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Two-tone bell chime
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.2); // E5
                gain2.gain.setValueAtTime(0.3, now + 0.2);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);

                osc1.start(now);
                osc1.stop(now + 1.2);
                osc2.start(now + 0.2);
                osc2.stop(now + 1.4);
            } catch (e) {
                console.warn("Audio Context playback error:", e);
            }
        }

        function triggerPeriodChangeEffects(activeItem) {
            // Play Audio
            playChime();

            // Display Toast
            showToast(`Now Starting: ${activeItem.name}`);

            // Trigger System Notification
            if (notificationsEnabled && "Notification" in window && Notification.permission === "granted") {
                new Notification("Bell Schedule Alert", {
                    body: `Now Starting: ${activeItem.name} (${format12Hour(activeItem.start)} - ${format12Hour(activeItem.end)})`,
                    icon: "https://placehold.co/128x128/2563eb/ffffff?text=Bell"
                });
            }
        }

        // Toast Popup Helper
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl border border-slate-700 text-sm font-medium flex items-center space-x-2 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0";
            toast.innerHTML = `<i data-lucide="bell" class="w-4 h-4 text-blue-400"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function populateScheduleDropdown() {
            const select = document.getElementById('schedule-select');
            select.innerHTML = '';

            Object.keys(schedules).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = schedules[key].name;
                if (key === activeScheduleKey) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function initTheme() {
            const themeBtn = document.getElementById('btn-theme');
            const themeIcon = document.getElementById('icon-theme');

            if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();

            themeBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                    themeIcon.setAttribute('data-lucide', 'sun');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                    themeIcon.setAttribute('data-lucide', 'moon');
                }
                lucide.createIcons();
            });
        }

        function updateSoundIcon() {
            const icon = document.getElementById('icon-sound');
            if (soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                document.getElementById('btn-sound').classList.add('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30');
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
                document.getElementById('btn-sound').classList.remove('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30');
            }
            lucide.createIcons();
        }

        function updateNotificationIcon() {
            const icon = document.getElementById('icon-notifications');
            if (notificationsEnabled) {
                icon.setAttribute('data-lucide', 'bell-ring');
                document.getElementById('btn-notifications').classList.add('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30');
            } else {
                icon.setAttribute('data-lucide', 'bell-off');
                document.getElementById('btn-notifications').classList.remove('bg-blue-50', 'text-blue-600', 'dark:bg-blue-900/30');
            }
            lucide.createIcons();
        }

        function initEventListeners() {
            // Preset Dropdown Change
            document.getElementById('schedule-select').addEventListener('change', (e) => {
                activeScheduleKey = e.target.value;
                localStorage.setItem('bell_active_key', activeScheduleKey);
                lastNotifiedPeriodKey = null;
                updateClockAndSchedule();
            });

            // Passing Toggle
            document.getElementById('show-transitions-toggle').addEventListener('change', (e) => {
                showTransitions = e.target.checked;
                updateClockAndSchedule();
            });

            // Sound Button Toggle
            document.getElementById('btn-sound').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                localStorage.setItem('bell_sound', soundEnabled);
                updateSoundIcon();
                if (soundEnabled) playChime();
            });

            // Notifications Button Toggle
            document.getElementById('btn-notifications').addEventListener('click', () => {
                if (!("Notification" in window)) {
                    showToast("Desktop notifications are not supported in this browser.");
                    return;
                }

                if (!notificationsEnabled) {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            notificationsEnabled = true;
                            localStorage.setItem('bell_notifications', 'true');
                            updateNotificationIcon();
                            showToast("Desktop notifications enabled!");
                        } else {
                            showToast("Notification permission denied.");
                        }
                    });
                } else {
                    notificationsEnabled = false;
                    localStorage.setItem('bell_notifications', 'false');
                    updateNotificationIcon();
                }
            });

            // Modal Controls
            const modal = document.getElementById('modal-settings');
            document.getElementById('btn-edit-schedule').addEventListener('click', () => {
                openModal();
            });

            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

            document.getElementById('modal-preset-select').addEventListener('change', (e) => {
                editingScheduleKey = e.target.value;
                tempEditingSchedule = JSON.parse(JSON.stringify(schedules[editingScheduleKey]));
                renderEditorPeriods();
            });

            document.getElementById('btn-add-period').addEventListener('click', () => {
                if (!tempEditingSchedule) return;
                tempEditingSchedule.periods.push({
                    name: `Period ${tempEditingSchedule.periods.length + 1}`,
                    start: "12:00",
                    end: "12:45",
                    type: "class"
                });
                renderEditorPeriods();
            });

            document.getElementById('btn-add-preset').addEventListener('click', () => {
                const name = prompt("Enter a name for the new schedule preset:", "New Custom Schedule");
                if (!name) return;

                const newKey = "custom_" + Date.now();
                schedules[newKey] = {
                    name: name,
                    periods: [
                        { name: "1st Period", start: "08:00", end: "09:00", type: "class" }
                    ]
                };
                editingScheduleKey = newKey;
                populateModalPresetDropdown();
                tempEditingSchedule = JSON.parse(JSON.stringify(schedules[editingScheduleKey]));
                renderEditorPeriods();
            });

            document.getElementById('btn-delete-preset').addEventListener('click', () => {
                if (Object.keys(schedules).length <= 1) {
                    showToast("Cannot delete the only schedule preset.");
                    return;
                }
                if (confirm(`Delete the "${schedules[editingScheduleKey].name}" schedule preset?`)) {
                    delete schedules[editingScheduleKey];
                    editingScheduleKey = Object.keys(schedules)[0];
                    if (!schedules[activeScheduleKey]) {
                        activeScheduleKey = editingScheduleKey;
                    }
                    saveSchedules();
                    populateScheduleDropdown();
                    populateModalPresetDropdown();
                    tempEditingSchedule = JSON.parse(JSON.stringify(schedules[editingScheduleKey]));
                    renderEditorPeriods();
                }
            });

            document.getElementById('btn-reset-defaults').addEventListener('click', () => {
                if (confirm("Reset all bell schedules to original default settings? Custom schedules will be lost.")) {
                    schedules = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES));
                    activeScheduleKey = "ms_regular";
                    editingScheduleKey = "ms_regular";
                    saveSchedules();
                    populateScheduleDropdown();
                    populateModalPresetDropdown();
                    tempEditingSchedule = JSON.parse(JSON.stringify(schedules[editingScheduleKey]));
                    renderEditorPeriods();
                    updateClockAndSchedule();
                    showToast("Schedules reset to defaults.");
                }
            });

            document.getElementById('btn-save-modal').addEventListener('click', () => {
                // Save temp schedule state
                readEditorFormValues();
                schedules[editingScheduleKey] = tempEditingSchedule;
                saveSchedules();
                populateScheduleDropdown();
                updateClockAndSchedule();
                closeModal();
                showToast("Schedule settings saved!");
            });
        }

        function openModal() {
            editingScheduleKey = activeScheduleKey;
            populateModalPresetDropdown();
            tempEditingSchedule = JSON.parse(JSON.stringify(schedules[editingScheduleKey]));
            renderEditorPeriods();
            document.getElementById('modal-settings').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-settings').classList.add('hidden');
        }

        function populateModalPresetDropdown() {
            const select = document.getElementById('modal-preset-select');
            select.innerHTML = '';
            Object.keys(schedules).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = schedules[key].name;
                if (key === editingScheduleKey) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function readEditorFormValues() {
            if (!tempEditingSchedule) return;
            const periodRows = document.querySelectorAll('.editor-period-row');
            const updatedPeriods = [];

            periodRows.forEach((row) => {
                const name = row.querySelector('.editor-name').value;
                const start = row.querySelector('.editor-start').value;
                const end = row.querySelector('.editor-end').value;
                const type = row.querySelector('.editor-type').value;

                updatedPeriods.push({ name, start, end, type });
            });

            tempEditingSchedule.periods = updatedPeriods;
        }

        function renderEditorPeriods() {
            const container = document.getElementById('editor-period-list');
            container.innerHTML = '';

            if (!tempEditingSchedule || !tempEditingSchedule.periods) return;

            tempEditingSchedule.periods.forEach((period, idx) => {
                const row = document.createElement('div');
                row.className = "editor-period-row flex flex-col sm:flex-row items-center gap-2 bg-slate-50 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-200 dark:border-slate-700/60";
                
                row.innerHTML = `
                    <div class="flex-1 w-full">
                        <input type="text" value="${period.name}" class="editor-name w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-1 focus:ring-blue-500" placeholder="Period Name">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="time" value="${period.start}" class="editor-start bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono">
                        <span class="text-xs text-slate-400">&ndash;</span>
                        <input type="time" value="${period.end}" class="editor-end bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono">
                        <select class="editor-type bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-medium">
                            <option value="class" ${period.type === 'class' ? 'selected' : ''}>Class</option>
                            <option value="lunch" ${period.type === 'lunch' ? 'selected' : ''}>Lunch</option>
                            <option value="assembly" ${period.type === 'assembly' ? 'selected' : ''}>Assembly</option>
                        </select>
                        <button class="btn-remove-period p-1.5 text-slate-400 hover:text-rose-500 rounded-lg transition" title="Remove Period">
                            <i data-lucide="trash" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;

                // Bind remove listener
                row.querySelector('.btn-remove-period').addEventListener('click', () => {
                    readEditorFormValues();
                    tempEditingSchedule.periods.splice(idx, 1);
                    renderEditorPeriods();
                });

                container.appendChild(row);
            });

            lucide.createIcons();
        }
    </script>
</body>
</html>
